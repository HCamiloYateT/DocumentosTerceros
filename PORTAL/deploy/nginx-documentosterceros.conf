# Bloque para incluir dentro del servidor HTTPS de analitica.racafe.com.
location = /documentosterceros {
    return 301 /documentosterceros/;
}

location = /documentosterceros/api/admin {
    return 404;
}

location ^~ /documentosterceros/api/admin/ {
    return 404;
}

location /documentosterceros/ {
    access_log off;
    proxy_pass http://127.0.0.1:8019/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /documentosterceros;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    client_max_body_size 16m;
}
